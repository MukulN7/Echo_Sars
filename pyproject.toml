[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-sars"
version = "0.1.0"
description = "ECHO-SARS Intelligence v0.1: Search-and-Rescue Multi-Modal Drone Perception Prototype"
authors = [{ name = "ECHO-SARS Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "h5py>=3.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

